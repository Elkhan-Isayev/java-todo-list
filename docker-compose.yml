services:
  mysql:
    image: mysql:8.0
    container_name: todolist-mysql
    restart: unless-stopped
    ports:
      - '4300:3306'
    environment:
      MYSQL_ROOT_PASSWORD: 'root'
      MYSQL_DATABASE: 'todolist'
    volumes:
      - todolist-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  todolist-data:
